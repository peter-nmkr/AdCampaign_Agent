proxy_location: EveryNode

http_options:
  host: 0.0.0.0
  port: 8000

applications:
  - name: campaign_generator
    route_prefix: /
    import_path: app:fast_app
    runtime_env: {}
    deployments:
      - name: CampaignGeneratorAgent
        num_replicas: 1
        ray_actor_options:
          num_cpus: 1
